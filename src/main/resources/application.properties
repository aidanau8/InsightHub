############################################
# APPLICATION
############################################
spring.application.name=insighthub
# Cloud Run uses PORT env var, locally it will fallback to 8080
server.port=${PORT:8080}

############################################
# DATABASE (PostgreSQL - Environment-based)
############################################
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insighthub}
spring.datasource.username=${DB_USERNAME:insighthub_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize schema/data.sql if present
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

############################################
# JPA / HIBERNATE
############################################
# Dev-friendly; for prod usually use validate + migrations
spring.jpa.hibernate.ddl-auto=update

# Reduce noise (turn on only when debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Recommended: avoid Open Session in View
spring.jpa.open-in-view=false

# Optional verbose Hibernate logs (OFF by default)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

############################################
# THYMELEAF
############################################
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

############################################
# LOGGING (Week 16)
############################################
logging.level.root=INFO
logging.level.com.internship.insighthub=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] [%X{username}] %logger{36} - %msg%n

############################################
# ACTUATOR
############################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

############################################
# OPENAI CONFIG (Environment-based)
############################################
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
